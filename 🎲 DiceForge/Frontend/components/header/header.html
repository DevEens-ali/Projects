<header class="app-header" id="app-header">

    <!-- Page Heading -->
    <div class="header-content">

        <div class="header-title-wrapper">

            <h1 class="header-title" id="page-title">
                DiceForge
            </h1>

            <p class="header-subtitle" id="page-subtitle">
                Roll. Forge. Conquer.
            </p>

        </div>

    </div>


    <!-- Header Actions -->
    <div class="header-actions">

        <!-- Theme Toggle -->
        <button
            class="header-action theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Toggle theme"
            title="Toggle theme"
        >
            <span class="action-icon" id="theme-icon">☾</span>
        </button>


        <!-- Achievement -->
        <button
            class="header-action"
            type="button"
            aria-label="Achievements"
            title="Achievements"
        >
            <span class="action-icon">🏆</span>
        </button>


        <!-- Profile -->
        <button
            class="profile-button"
            type="button"
            aria-label="Profile"
        >

            <span class="profile-avatar">
                DM
            </span>

            <span class="profile-info">

                <span class="profile-name">
                    DiceMaster
                </span>

                <span class="profile-status">
                    Dice Forger
                </span>

            </span>

            <span class="profile-arrow">
                ▾
            </span>

        </button>

    </div>

</header>
